plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

group = 'com.example.endoapp'
version = '1.0-SNAPSHOT'

android {
    namespace 'com.example.endoapp'

    compileSdk 37

    defaultConfig {
        applicationId 'com.example.endoapp'
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Firebase         -- for Gemini integration
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck-debug'

    // HTTP requests
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    // for maps functionality
    implementation 'com.google.maps.android:maps-ktx:6.4.1'
    implementation 'com.google.maps.android:maps-utils-ktx:6.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.1'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    implementation platform('io.github.jan-tennert.supabase:bom:3.8.0')

    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:auth-kt'

    implementation 'io.ktor:ktor-client-android:3.5.2'
}
